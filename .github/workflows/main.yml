name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 12266719
        accept-android-sdk-licenses: true
        packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

    - name: Force Accept Android SDK Licenses
      run: |
        yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Cleanup unnecessary files & Disable signing check
      run: |
        rm -f app/google-services.json
        find . -name "build.gradle*" -exec sed -i '/signingConfig /d' {} + || true
        chmod +x gradlew || true

    - name: Build APK with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug -x lint -Pcom.google.gms.google-services.disabled=true
        else
          gradle assembleDebug -x lint -Pcom.google.gms.google-services.disabled=true
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hello-sir-debug
        path: |
          app/build/outputs/apk/debug/*.apk
          build/outputs/apk/debug/*.apk
